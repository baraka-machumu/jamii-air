# Local infrastructure for Jamii Air (Plan task 1.1, story E0-01).
# Start: `docker compose up -d` in backend/. Values come from backend/.env (see .env.example).
# All ports bind to 127.0.0.1 only.

name: jamii-air

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-jamii_air}
      # read by docker/postgres/init/01-roles.sql on first start
      JAMII_OWNER_PASSWORD: ${JAMII_OWNER_PASSWORD:?set in backend/.env}
      JAMII_APP_PASSWORD: ${JAMII_APP_PASSWORD:?set in backend/.env}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_functions=all
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: the temporary server used during init listens on the socket only
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set in backend/.env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MinIO community build (pgsty): upstream stopped publishing images in 2025.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in backend/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in backend/.env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the private media bucket (Schema §10), then exits.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-jamii-air-media-local}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set private "local/$$S3_BUCKET"
        mc version enable "local/$$S3_BUCKET"
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── The app in containers (optional): `docker compose --profile app up -d --build` ──
  # Same image as UAT / production (Dockerfile). Run `npm run db:generate` first.
  migrate:
    profiles: [app]
    build: { context: ., target: migrator }
    environment:
      MIGRATION_DATABASE_URL: postgresql://jamii_owner:${JAMII_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB:-jamii_air}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [app]
    build: { context: ., target: runtime }
    image: jamii-air-api:local
    init: true # tini as PID 1: SIGTERM reaches Node, graceful shutdown
    environment: &app-env
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REQUIRE_INVITE: ${REQUIRE_INVITE:-true}
      DATABASE_URL: postgresql://jamii_app:${JAMII_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-jamii_air}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in backend/.env}
      AUTH_CODE_SECRET: ${AUTH_CODE_SECRET:?set in backend/.env}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    profiles: [app]
    image: jamii-air-api:local
    command: ["node", "dist/worker.js"]
    init: true
    environment: *app-env
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mailpit-data:
