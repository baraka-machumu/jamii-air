# Jamii Air — UAT stack (Plan task 2.16, the deferred "deploy to UAT" half).
#
# Runs on the shared UAT host 41.59.227.223 (CentOS 7) alongside four unrelated projects, so:
#   * every container is prefixed `jamii-uat-` and the project name is `jamii-air-uat`;
#   * only 4011 (API), 4012 (portal, TLS) and 4013 (media) are published to the world —
#     everything else binds to 127.0.0.1 or stays on the internal network;
#   * all state is bind-mounted under /home/jamii-air/data, because the host's / is 91% full
#     and /home has 42 GB free. Nothing we store may threaten the other projects on this box.
#
# `security_opt: seccomp=unconfined` is not cosmetic: the host has libseccomp 2.3.1 (2016), which
# does not know the syscalls modern images use, so it returns EPERM instead of allowing them.
# Without it PostgreSQL 18 dies in initdb ("could not write to file postmaster.pid: Operation not
# permitted"). It is scoped to our containers only. Remove it on a host with libseccomp >= 2.5.
#
# Deploy with deploy/uat/deploy.sh from the repo root. Values come from .env.uat on the host.

name: jamii-air-uat

x-app-env: &app-env
  NODE_ENV: uat
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PORT: 3000
  REQUIRE_INVITE: ${REQUIRE_INVITE:-true}
  DATABASE_URL: postgresql://jamii_app:${JAMII_APP_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-jamii_air}
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
  AUTH_CODE_SECRET: ${AUTH_CODE_SECRET:?}
  ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?}
  ADMIN_TOTP_KEY: ${ADMIN_TOTP_KEY:?}
  ADMIN_ORIGIN: ${ADMIN_ORIGIN:?}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?}
  MEDIA_BASE_URL: ${MEDIA_BASE_URL:?}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:?}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?}
  ANDROID_PACKAGE: ${ANDROID_PACKAGE:-}
  # Mailpit unless a real provider is configured in .env (Resend, since 2026-10-16). Mailpit is
  # still running, so clearing SMTP_USER/SMTP_PASSWORD falls straight back to catching mail.
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  MAIL_FROM: ${MAIL_FROM:-Jamii Air (UAT) <no-reply@jamii-air.uat>}
  MIN_APP_VERSION: ${MIN_APP_VERSION:-}
  # Rate limits count the client, not the portal's nginx (Plan 5.4, docs/09 F2). Only this stack's
  # Docker network is trusted: the API is published by DNAT (checked 2026-10-22), so a client on
  # :4011 arrives with its own public address and cannot claim another. If the network is ever
  # recreated with another range, this simply stops matching and nothing is trusted.
  TRUST_PROXY: 192.168.112.0/20
  EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: jamii-uat-postgres
    restart: unless-stopped
    security_opt: [seccomp=unconfined]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-jamii_air}
      JAMII_OWNER_PASSWORD: ${JAMII_OWNER_PASSWORD:?}
      JAMII_APP_PASSWORD: ${JAMII_APP_PASSWORD:?}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_functions=all
    ports:
      # Localhost only: the migration step reaches this through an SSH tunnel.
      - "127.0.0.1:5433:5432"
    volumes:
      - /home/jamii-air/data/postgres:/var/lib/postgresql
      - /home/jamii-air/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    container_name: jamii-uat-redis
    restart: unless-stopped
    security_opt: [seccomp=unconfined]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - /home/jamii-air/data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: jamii-uat-minio
    restart: unless-stopped
    security_opt: [seccomp=unconfined]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    ports:
      # Public: phones PUT to presigned URLs here and load photo variants from here.
      - "0.0.0.0:4013:9000"
      - "127.0.0.1:4014:9001"
    volumes:
      - /home/jamii-air/data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: private bucket, versioning, lifecycle, public read for the variants only: the .webp
  # renders and the 720p MP4 a video post plays. Originals (key `original`, no extension) stay private.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: jamii-uat-minio-init
    security_opt: [seccomp=unconfined]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set private "local/$$S3_BUCKET"
        mc version enable "local/$$S3_BUCKET"
        printf '%s' '{"Rules":[{"ID":"expire-noncurrent","Status":"Enabled","Filter":{"Prefix":""},"NoncurrentVersionExpiration":{"NoncurrentDays":1}}]}' > /tmp/ilm.json
        mc ilm import "local/$$S3_BUCKET" < /tmp/ilm.json
        printf '%s' "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::$$S3_BUCKET/users/*/media/*/*.webp\",\"arn:aws:s3:::$$S3_BUCKET/users/*/media/*/video_720.mp4\"]}]}" > /tmp/variants.json
        mc anonymous set-json /tmp/variants.json "local/$$S3_BUCKET"
    restart: "no"

  # No transactional email provider yet (Plan 5.0), so UAT keeps catching mail.
  # Password-reset codes are read from the Mailpit UI over an SSH tunnel to 127.0.0.1:8026.
  mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: jamii-uat-mailpit
    restart: unless-stopped
    security_opt: [seccomp=unconfined]
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:8026:8025"
    volumes:
      - /home/jamii-air/data/mailpit:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    image: jamii-air-api:uat
    container_name: jamii-uat-api
    restart: unless-stopped
    security_opt: [seccomp=unconfined]
    init: true
    environment: *app-env
    ports:
      - "0.0.0.0:4011:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    image: jamii-air-api:uat
    container_name: jamii-uat-worker
    restart: unless-stopped
    security_opt: [seccomp=unconfined]
    command: ["node", "dist/worker.js"]
    init: true
    environment: *app-env
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_started

  # The portal is a static bundle. nginx also reverse-proxies /api to the API, because the
  # portal calls window.location.origin (admin/src/api/client.ts) and the admin refresh cookie
  # is httpOnly + Secure + SameSite=Strict: it only works same-origin and only over HTTPS.
  # Hence TLS here with a self-signed certificate (no domain yet, Plan 5.0).
  portal:
    image: nginx:1.27-alpine
    container_name: jamii-uat-portal
    restart: unless-stopped
    security_opt: [seccomp=unconfined]
    ports:
      - "0.0.0.0:4012:443"
    volumes:
      - /home/jamii-air/portal:/usr/share/nginx/html:ro
      - /home/jamii-air/nginx/portal.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/jamii-air/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_started
