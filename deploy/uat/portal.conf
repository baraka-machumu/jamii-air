# nginx for the Jamii Air admin portal on UAT (Plan task 4.7, the UAT half).
#
# Two jobs:
#   1. serve the Vite bundle, with an SPA fallback so react-router deep links work on reload;
#   2. reverse-proxy /api to the API, so the portal and the API share one origin. That is not a
#      convenience: admin/src/api/client.ts calls window.location.origin, and the admin refresh
#      cookie is httpOnly + Secure + SameSite=Strict, so it is only sent same-origin over HTTPS.
#
# TLS is a self-signed certificate because there is no domain yet (Plan 5.0). Browsers will warn
# once per session; that is expected on UAT and goes away when the real certificate arrives.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/portal.crt;
    ssl_certificate_key /etc/nginx/certs/portal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # The portal is for admins only and is reachable from any IP on this box (the spec's office
    # IP allowlist waits for Plan 5.0). Keep it out of search engines meanwhile.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Photos in report and account screens come from MinIO on :4013 over plain HTTP, so the
    # browser would block them as mixed content under a strict img-src. Allow them explicitly.
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Hashed assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
